[package]
name = "pmcimg-core"
version = "0.1.0"
edition = "2021"
description = "PMC-Image v0 core library (Rust + optional WASM bindings)"
license = "Apache-2.0"
repository = "https://github.com/younesZdDz/pmcimg-prototype"

[features]
default = []
wasm = ["wasm-bindgen"]

[dependencies]
aead = "0.5"
aes-gcm = { version = "0.10", features = ["aes"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["cdylib", "rlib"]